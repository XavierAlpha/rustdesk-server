name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref reachable from the default branch; blank uses the default branch
        required: false
        type: string
        default: ""
      publish:
        description: Publish images, tag, and GitHub release after the build succeeds
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: server-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-tag:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
      ghcr_image: ${{ steps.release.outputs.ghcr_image }}
      ghcr_image_classic: ${{ steps.release.outputs.ghcr_image_classic }}
      hbb_common: ${{ steps.release.outputs.hbb_common }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Test and validate component version
        id: metadata
        run: |
          python scripts/test_release_metadata.py
          python scripts/release_metadata.py --github-output

      - name: Resolve verified release source
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "release source $commit is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            for candidate_tag in "$RELEASE_TAG" "$VERSION"; do
              if git ls-remote --exit-code --tags origin "refs/tags/$candidate_tag" >/dev/null 2>&1; then
                echo "release version already has a tag: $candidate_tag" >&2
                exit 1
              fi
            done
          fi

          runs_json="$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$commit" \
              -f event=push \
              -f status=success \
              -f per_page=100
          )"
          ci_run_id="$(
            jq -r --arg commit "$commit" \
              '[.workflow_runs[] | select(.head_sha == $commit and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' \
              <<< "$runs_json"
          )"
          if [[ -z "$ci_run_id" ]]; then
            echo "no successful push CI run exists for $commit" >&2
            exit 1
          fi
          source_date_epoch=$(git show -s --format=%ct "$commit")
          repository_lower="${GITHUB_REPOSITORY,,}"
          hbb_common="$(git ls-tree "$commit" -- libs/hbb_common | awk '$2 == "commit" { print $3 }')"
          if [[ ! "$hbb_common" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source does not pin one full hbb_common commit" >&2
            exit 1
          fi

          {
            echo "commit=$commit"
            echo "ci_run_id=$ci_run_id"
            echo "ghcr_image=ghcr.io/${repository_lower}-s6"
            echo "ghcr_image_classic=ghcr.io/${repository_lower}"
            echo "hbb_common=$hbb_common"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize release candidate
        env:
          CI_RUN_ID: ${{ steps.release.outputs.ci_run_id }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "### Server release candidate"
            echo
            echo "- Version: \`$VERSION\` (\`$RELEASE_TAG\`)"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Reused CI run: \`$CI_RUN_ID\`"
            echo "- Publish: \`$PUBLISH\`"
          } >> "$GITHUB_STEP_SUMMARY"

  approval:
    name: Approve production release
    if: inputs.publish
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Record approval gate
        run: echo "Production release approved for ${{ needs.validate-release-tag.outputs.tag }}"

  build-linux:
    name: Build Linux (${{ matrix.name }})
    if: >-
      always() &&
      needs.validate-release-tag.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    needs:
      - validate-release-tag
      - approval
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            target: x86_64-unknown-linux-musl
          - name: arm64v8
            target: aarch64-unknown-linux-musl
          - name: armv7
            target: armv7-unknown-linux-musleabihf
          - name: i386
            target: i686-unknown-linux-musl

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build locked release
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate-release-tag.outputs.source_date_epoch }}
          TARGET: ${{ matrix.target }}
        run: cross build --locked --release --all-features --target "$TARGET"

      - name: Verify release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod 0755 \
            "target/$TARGET/release/hbbs" \
            "target/$TARGET/release/hbbr" \
            "target/$TARGET/release/rustdesk-utils"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-linux-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/hbbs
            target/${{ matrix.target }}/release/hbbr
            target/${{ matrix.target }}/release/rustdesk-utils
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (x86_64)
    if: >-
      always() &&
      needs.validate-release-tag.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    needs:
      - validate-release-tag
      - approval
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build server binaries
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate-release-tag.outputs.source_date_epoch }}
        run: cargo build --locked --release --all-features --target x86_64-pc-windows-msvc

      - name: Upload Windows binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/hbbs.exe
            target/x86_64-pc-windows-msvc/release/hbbr.exe
            target/x86_64-pc-windows-msvc/release/rustdesk-utils.exe
          if-no-files-found: error
          retention-days: 7

  docker-s6:
    name: Build s6 image (${{ matrix.name }})
    needs:
      - validate-release-tag
      - build-linux
      - build-windows
      - deb-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            s6_arch: x86_64
            s6_sha256: e6befcc96a437a3831386ecfc51808c5d3e939dc5fe3c02ae9284599e8aa2408
          - name: arm64v8
            platform: linux/arm64
            s6_arch: aarch64
            s6_sha256: b17f17a82e7a515c682a91edaf2ffdabb73f891981b6c1fd712115693a2f8b4c
          - name: armv7
            platform: linux/arm/v7
            s6_arch: armhf
            s6_sha256: 64fc0a4d8917658e6da5f5878e2e410e92b60faf3d39a9bef1452dabe031dd40
          - name: i386
            platform: linux/386
            s6_arch: i686
            s6_sha256: 3139bc0ddc7d51631cd646e4438bf83a649fb4ff027bfca8e769071b21b00b0b

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}
          submodules: false

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries-linux-${{ matrix.name }}
          path: docker/rootfs/usr/bin

      - name: Make binaries executable
        run: chmod 0755 docker/rootfs/usr/bin/hbbs docker/rootfs/usr/bin/hbbr docker/rootfs/usr/bin/rustdesk-utils

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish s6 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate-release-tag.outputs.source_date_epoch }}
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish }}
          provenance: mode=max
          sbom: true
          build-args: |
            S6_ARCH=${{ matrix.s6_arch }}
            S6_ARCH_SHA256=${{ matrix.s6_sha256 }}
          tags: ${{ needs.validate-release-tag.outputs.ghcr_image }}:${{ needs.validate-release-tag.outputs.tag }}-${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release-tag.outputs.commit }}
            org.opencontainers.image.version=${{ needs.validate-release-tag.outputs.tag }}

  docker-s6-manifest:
    name: Publish s6 multi-architecture manifest
    if: inputs.publish
    needs:
      - validate-release-tag
      - docker-s6
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned manifest
        env:
          GHCR_IMAGE: ${{ needs.validate-release-tag.outputs.ghcr_image }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${RELEASE_TAG}" \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${RELEASE_TAG}-amd64" \
            "${GHCR_IMAGE}:${RELEASE_TAG}-arm64v8" \
            "${GHCR_IMAGE}:${RELEASE_TAG}-armv7" \
            "${GHCR_IMAGE}:${RELEASE_TAG}-i386"

  docker-classic:
    name: Build classic image (${{ matrix.name }})
    needs:
      - validate-release-tag
      - build-linux
      - build-windows
      - deb-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
          - name: arm64v8
            platform: linux/arm64
          - name: armv7
            platform: linux/arm/v7
          - name: i386
            platform: linux/386

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}
          submodules: false

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries-linux-${{ matrix.name }}
          path: docker-classic

      - name: Make binaries executable
        run: chmod 0755 docker-classic/hbbs docker-classic/hbbr docker-classic/rustdesk-utils

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish classic image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate-release-tag.outputs.source_date_epoch }}
        with:
          context: docker-classic
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish }}
          provenance: mode=max
          sbom: true
          tags: ${{ needs.validate-release-tag.outputs.ghcr_image_classic }}:${{ needs.validate-release-tag.outputs.tag }}-${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release-tag.outputs.commit }}
            org.opencontainers.image.version=${{ needs.validate-release-tag.outputs.tag }}

  docker-classic-manifest:
    name: Publish classic multi-architecture manifest
    if: inputs.publish
    needs:
      - validate-release-tag
      - docker-classic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned manifest
        env:
          GHCR_IMAGE_CLASSIC: ${{ needs.validate-release-tag.outputs.ghcr_image_classic }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE_CLASSIC}:${RELEASE_TAG}" \
            --tag "${GHCR_IMAGE_CLASSIC}:latest" \
            "${GHCR_IMAGE_CLASSIC}:${RELEASE_TAG}-amd64" \
            "${GHCR_IMAGE_CLASSIC}:${RELEASE_TAG}-arm64v8" \
            "${GHCR_IMAGE_CLASSIC}:${RELEASE_TAG}-armv7" \
            "${GHCR_IMAGE_CLASSIC}:${RELEASE_TAG}-i386"

  deb-package:
    name: Build Debian packages (${{ matrix.name }})
    needs:
      - validate-release-tag
      - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            deb_arch: amd64
          - name: arm64v8
            deb_arch: arm64
          - name: armv7
            deb_arch: armhf
          - name: i386
            deb_arch: i386

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}
          submodules: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            debhelper

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries-linux-${{ matrix.name }}
          path: debian-build/${{ matrix.name }}/bin

      - name: Build packages
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          debian/build-packages.sh \
            --architecture "$DEB_ARCH" \
            --workspace "debian-build/$MATRIX_NAME"

      - name: Upload Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-debian-${{ matrix.name }}
          path: debian-build/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: inputs.publish
    needs:
      - validate-release-tag
      - build-linux
      - build-windows
      - docker-s6-manifest
      - docker-classic-manifest
      - deb-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout immutable release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.commit }}

      - name: Recheck release tag immutability
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          VERSION: ${{ needs.validate-release-tag.outputs.version }}
        run: |
          for candidate_tag in "$RELEASE_TAG" "$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$candidate_tag" >/dev/null 2>&1; then
              echo "release version already has a tag: $candidate_tag" >&2
              exit 1
            fi
          done

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binaries-*
          path: artifacts/binaries

      - name: Download Debian artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-debian-*
          path: artifacts/debian

      - name: Restore executable release modes
        run: |
          for architecture in amd64 arm64v8 armv7 i386; do
            chmod 0755 \
              "artifacts/binaries/binaries-linux-$architecture/hbbs" \
              "artifacts/binaries/binaries-linux-$architecture/hbbr" \
              "artifacts/binaries/binaries-linux-$architecture/rustdesk-utils"
          done

      - name: Package release files
        env:
          CI_RUN_ID: ${{ needs.validate-release-tag.outputs.ci_run_id }}
          GHCR_IMAGE: ${{ needs.validate-release-tag.outputs.ghcr_image }}
          GHCR_IMAGE_CLASSIC: ${{ needs.validate-release-tag.outputs.ghcr_image_classic }}
          HBB_COMMON_COMMIT: ${{ needs.validate-release-tag.outputs.hbb_common }}
          RELEASE_COMMIT: ${{ needs.validate-release-tag.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          VERSION: ${{ needs.validate-release-tag.outputs.version }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import stat
          import zipfile

          output = Path("release")
          output.mkdir()
          metadata = {
              "version": os.environ["VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["RELEASE_COMMIT"],
              "hbb_common_commit": os.environ["HBB_COMMON_COMMIT"],
              "verified_ci_run_id": int(os.environ["CI_RUN_ID"]),
              "images": [
                  os.environ["GHCR_IMAGE"],
                  os.environ["GHCR_IMAGE_CLASSIC"],
              ],
          }
          (output / "release-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def archive(source: Path, destination: Path, names: tuple[str, ...]) -> None:
              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
                  for name in names:
                      path = source / name
                      info = zipfile.ZipInfo(name)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      info.external_attr = (
                          stat.S_IFREG | stat.S_IMODE(path.stat().st_mode)
                      ) << 16
                      bundle.writestr(info, path.read_bytes())

          for architecture in ("amd64", "arm64v8", "armv7", "i386"):
              archive(
                  Path("artifacts/binaries") / f"binaries-linux-{architecture}",
                  output / f"camellia-server-linux-{architecture}.zip",
                  ("hbbs", "hbbr", "rustdesk-utils"),
              )

          archive(
              Path("artifacts/binaries/binaries-windows-x86_64"),
              output / "camellia-server-windows-x86_64.zip",
              ("hbbs.exe", "hbbr.exe", "rustdesk-utils.exe"),
          )

          for package in Path("artifacts/debian").glob("**/*.deb"):
              destination = output / package.name
              if destination.exists():
                  raise RuntimeError(f"duplicate package name: {package.name}")
              shutil.copy2(package, destination)

          checksum_lines = []
          for path in sorted(output.iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {path.name}")
          (output / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          PY

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          subject-path: release/*

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          tag_name: ${{ needs.validate-release-tag.outputs.tag }}
          target_commitish: ${{ needs.validate-release-tag.outputs.commit }}
          files: release/*
