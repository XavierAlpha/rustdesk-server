name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      deployment: ${{ steps.changes.outputs.deployment }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          runtime=false
          deployment=false
          dependencies=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            runtime=true
            deployment=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            else
              base="$PUSH_BASE_SHA"
              head="$PUSH_HEAD_SHA"
            fi
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree /dev/null)"
            fi

            changed_paths="$RUNNER_TEMP/server-changed-paths"
            git diff --name-only -z "$base" "$head" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|README_EN.md|docs/*|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*|.github/*|docker/*|docker-classic/*|debian/*|docker-compose*.yml|docker-compose*.yaml|kubernetes/*)
                  ;;
                *)
                  runtime=true
                  ;;
              esac
              case "$path" in
                .github/*|docker/*|docker-classic/*|debian/*|docker-compose*.yml|docker-compose*.yaml|kubernetes/*)
                  deployment=true
                  ;;
              esac
              case "$path" in
                Cargo.toml|Cargo.lock|.gitmodules|libs/hbb_common|docker/Dockerfile|docker-classic/Dockerfile|.github/dependabot.yml|.github/workflows/*)
                  dependencies=true
                  ;;
              esac
            done < "$changed_paths"
          fi

          {
            echo "runtime=$runtime"
            echo "deployment=$deployment"
            echo "dependencies=$dependencies"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Change classification"
            echo
            echo "- Rust validation: \`$runtime\`"
            echo "- Deployment validation: \`$deployment\`"
            echo "- Dependency review: \`$dependencies\`"
          } >> "$GITHUB_STEP_SUMMARY"

  metadata:
    name: Validate component version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test and validate release metadata
        id: release
        run: |
          python scripts/test_release_metadata.py
          python scripts/release_metadata.py --github-output

  dependency_review:
    name: Review dependency changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.dependencies == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency graph delta
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  workflow:
    name: Workflow and deployment configuration
    if: needs.classify.outputs.deployment == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint container scripts
        run: |
          shellcheck \
            debian/build-packages.sh \
            docker/rootfs/usr/bin/healthcheck.sh \
            docker/rootfs/etc/s6-overlay/s6-rc.d/hbbr/finish \
            docker/rootfs/etc/s6-overlay/s6-rc.d/hbbr/run \
            docker/rootfs/etc/s6-overlay/s6-rc.d/hbbs/finish \
            docker/rootfs/etc/s6-overlay/s6-rc.d/hbbs/run \
            docker/rootfs/etc/s6-overlay/s6-rc.d/key-secret/up.real \
            debian/rustdesk-server-hbbr.postinst \
            debian/rustdesk-server-hbbs.postinst

      - name: Verify executable deployment scripts
        run: |
          test -x debian/build-packages.sh
          test -x docker/rootfs/usr/bin/healthcheck.sh
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/hbbr/finish
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/hbbr/run
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/hbbs/finish
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/hbbs/run
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/key-secret/up.real
          test -x debian/rustdesk-server-hbbr.postinst
          test -x debian/rustdesk-server-hbbs.postinst

      - name: Validate Debian metadata
        run: |
          dpkg-parsechangelog --file debian/changelog >/dev/null
          systemd-analyze security --offline=yes \
            debian/rustdesk-server-hbbr.rustdesk-hbbr.service \
            debian/rustdesk-server-hbbs.rustdesk-hbbs.service >/dev/null

      - name: Build Debian packaging fixture
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            debhelper

          package_root="$RUNNER_TEMP/camellia-debian-fixture"
          install -d "$package_root/bin"
          server_stub="$RUNNER_TEMP/camellia-server-static-stub"
          printf '%s\n' 'int main(void) { return 0; }' \
            | cc -static -s -x c -o "$server_stub" -
          install -m 0755 "$server_stub" "$package_root/bin/hbbs"
          install -m 0755 "$server_stub" "$package_root/bin/hbbr"
          install -m 0755 "$server_stub" "$package_root/bin/rustdesk-utils"
          debian/build-packages.sh \
            --architecture "$(dpkg --print-architecture)" \
            --workspace "$package_root"

      - name: Lint Dockerfiles
        run: |
          hadolint_path="$RUNNER_TEMP/hadolint"
          curl --fail --silent --show-error --location \
            --output "$hadolint_path" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  $hadolint_path" \
            | sha256sum --check
          chmod 0755 "$hadolint_path"
          "$hadolint_path" docker/Dockerfile docker-classic/Dockerfile

      - name: Validate Compose model
        env:
          CAMELLIA_API_SERVER: https://api.example.com
          CAMELLIA_DEVICE_VERIFICATION_TOKEN_FILE: /tmp/device-verification-token
          CAMELLIA_RELAY_ADDRESS: relay.example.com:21117
          CAMELLIA_SERVER_IMAGE: ghcr.io/example/camellia-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose --file docker-compose.yml config --quiet

      - name: Validate Kubernetes manifest
        run: >-
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          -strict
          -summary
          -kubernetes-version 1.36.0
          kubernetes/example.yaml

  rust:
    name: Rust quality gates
    if: needs.classify.outputs.runtime == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint server code
        run: cargo clippy --locked -p hbbs --all-targets --all-features --no-deps -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Install RustSec audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Verify ignored RSA driver is unreachable
        run: |
          if [[ -n "$(cargo tree -i rsa --target all --workspace --all-features 2>/dev/null)" ]]; then
            echo "RUSTSEC-2023-0071 is reachable; remove the audit exception." >&2
            exit 1
          fi
          if [[ -z "$(cargo tree -i sodiumoxide --target all --workspace --all-features 2>/dev/null)" ]]; then
            echo "sodiumoxide is gone; remove RUSTSEC-2021-0137 from the audit exceptions." >&2
            exit 1
          fi

      - name: Audit locked dependencies
        # SQLx records its disabled MySQL driver in Cargo.lock. RSA is only
        # reachable through that unenabled driver (`cargo tree -i rsa
        # --target all` is empty), and upstream has no patched release.
        # sodiumoxide is an unmaintained wrapper advisory, not a known
        # vulnerability; the deployed NaCl wire protocol still uses its
        # libsodium implementation. Deny every other warning so each future
        # exception requires an explicit review.
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2021-0137

  windows:
    name: Windows compile and tests
    if: needs.classify.outputs.runtime == 'true'
    needs: classify
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows-x86_64

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  required:
    name: CI / Required
    if: always()
    needs:
      - classify
      - metadata
      - dependency_review
      - workflow
      - rust
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_REQUIRED: ${{ needs.classify.outputs.runtime }}
          DEPLOYMENT_REQUIRED: ${{ needs.classify.outputs.deployment }}
          DEPENDENCIES_CHANGED: ${{ needs.classify.outputs.dependencies }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          failure=false
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name must succeed, got: $result" >&2
              failure=true
            fi
          }

          require_success "change classification" "$CLASSIFY_RESULT"
          require_success "component version validation" "$METADATA_RESULT"
          if [[ "$DEPLOYMENT_REQUIRED" == "true" ]]; then
            require_success "workflow and deployment validation" "$WORKFLOW_RESULT"
          fi
          if [[ "$RUNTIME_REQUIRED" == "true" ]]; then
            require_success "Rust quality" "$RUST_RESULT"
            require_success "Windows validation" "$WINDOWS_RESULT"
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCIES_CHANGED" == "true" ]]; then
            require_success "dependency review" "$DEPENDENCY_REVIEW_RESULT"
          fi
          if [[ "$failure" == "true" ]]; then
            exit 1
          fi
